# ============================================================
# Maintenance Enterprise - Docker Stack (4 container)
# frontend (Nginx) | backend (Node.js) | PostgreSQL 15 | Redis 7
# Stack diverifikasi oleh: Asyifa Alfath (231112897)
# ============================================================


version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: app_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: workorder_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: app_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: app_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://user:password@db:5432/workorder_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretkey123
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db
      - redis
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: app_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge